<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script defer src="assets/js/index.js"></script>
  </head>
  <body>
    <article>
      <form action="#" class="contactForm">
        <h1>Contact form</h1>
        <p>Please fill in your information and we'll be sending your order.</p>
        <label>
          <span>Your name</span>
          <div>
            <input
              type="text"
              name="firstName"
              placeholder="firstName"
              autofocus
              pattern="[A-Z][a-z]{1,19}"
              required
            />
            <input
              type="text"
              name="surname"
              placeholder="last name"
              pattern="[A-Z][a-z]{1,19}"
            />
          </div>
        </label>
        <label>
          <span>Your email</span>
          <input
            type="email"
            name="email"
            placeholder="your_mail@mail.com"
            pattern="(?=.{4,}).*@.*"
            required
          />
        </label>
        <label>
          <span>Phone *</span>
          <div>
            <input type="tel" name="phone" placeholder="099" pattern="0\d{2}" />
            <input type="tel" name="phone1" placeholder="123" pattern="\d{3}" />
            <input type="tel" name="phone2" placeholder="4567" pattern="\d{4}" />
          </div>
        </label>
        <label>
          <span>Message subject *</span>
          <select name="messSubj">
            <option value="">Other</option>
          </select>
        </label>
        <label>
          <span>Message *</span>
          <textarea
            name="mess"
            rows="4"
            required
            minlength="10"
            maxlength="120"
          ></textarea>
        </label>
        <button type="submit" class="submitBtn">SUBMIT FORM</button>
      </form>
    </article>
  </body>
</html>
